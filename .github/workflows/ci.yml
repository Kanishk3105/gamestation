name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamestation
          POSTGRES_USER: gamestation
          POSTGRES_PASSWORD: gamestation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gamestation -d gamestation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://gamestation:gamestation@localhost:5432/gamestation?schema=public
      SESSION_SECRET: ci-session-secret-change-me-32chars!!
      OTP_MODE: development
      OTP_DEV_CODE: '246810'
      WEB_ORIGIN: http://localhost:5173
      PAYMENT_PROVIDER: development

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
