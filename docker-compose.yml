version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamestation
      POSTGRES_USER: gamestation
      POSTGRES_PASSWORD: gamestation
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamestation -d gamestation']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://gamestation:gamestation@postgres:5432/gamestation?schema=public
      SESSION_SECRET: dev-session-secret-change-me-32chars!!
      OTP_MODE: development
      OTP_DEV_CODE: '246810'
      WEB_ORIGIN: http://localhost:5173
      PAYMENT_PROVIDER: development
    ports:
      - '4000:4000'
    command: npm run dev:server

volumes:
  postgres_data:
